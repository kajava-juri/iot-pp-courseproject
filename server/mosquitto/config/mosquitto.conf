# Eclipse Mosquitto configuration
# ─────────────────────────────────────────────────────────────────────────────

# Allow connections from any interface
listener 1883

# WebSocket listener (used by browser clients)
listener 9001
protocol websockets

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence true
persistence_location /mosquitto/data/

# Allow unauthenticated access (development only – add auth for production)
allow_anonymous true
