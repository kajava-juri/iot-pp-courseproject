; PlatformIO Project Configuration – Room Node
; ─────────────────────────────────────────────────────────────────────────────
; Target: ESP32 room sensor node
; Role:   Reads temperature, humidity and CO2 sensors and publishes over MQTT.
[env]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 921600
upload_port = /dev/ttyUSB1
monitor_speed = 115200
lib_deps = ITTIoT
extra_scripts = pre:../scripts/load_env.py

[env:pir_node]
build_src_filter = +<pir_node.cpp>