; PlatformIO Project Configuration – Room Node
; ─────────────────────────────────────────────────────────────────────────────
; Target: ESP32 room sensor node
; Role:   Reads temperature, humidity and CO2 sensors and publishes over MQTT.

[env:d1]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_speed = 115200
