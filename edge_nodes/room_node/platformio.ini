; PlatformIO Project Configuration – Room Node
; ─────────────────────────────────────────────────────────────────────────────
; Target: ESP32 room sensor node
; Role:   Reads temperature, humidity and CO₂ sensors and publishes over MQTT.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient @ ^2.8       ; MQTT client
    adafruit/DHT sensor library @ ^1.4  ; DHT22 temperature/humidity
    adafruit/Adafruit BusIO             ; required by DHT library

monitor_speed = 115200
