; PlatformIO Project Configuration – Interface Node
; ─────────────────────────────────────────────────────────────────────────────
; Target: ESP32 interface node
; Role:   controls OLED disaply
[env]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_speed = 115200
lib_deps = ITTIoT
extra_scripts = pre:../scripts/load_env.py

[env:d1]
