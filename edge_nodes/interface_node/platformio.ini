; PlatformIO Project Configuration – Interface Node
; ─────────────────────────────────────────────────────────────────────────────
; Target: ESP32 gateway / interface node
; Role:   Acts as a Wi-Fi + MQTT bridge; receives data from other edge nodes
;         and forwards them to the MQTT broker.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient @ ^2.8   ; MQTT client

monitor_speed = 115200
