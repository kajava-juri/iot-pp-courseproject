; PlatformIO Project Configuration – Wearable Node
; ─────────────────────────────────────────────────────────────────────────────
; Target: ESP32 wearable device
; Role:   Reads encoder/imu (simulates IMU) and humidity/temperature sensors and publishes over MQTT.
[env]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_speed = 115200
lib_deps = ITTIoT
extra_scripts = pre:../scripts/load_env.py

[env:pir_node]
build_src_filter = +<pir_node.cpp>

[env:pin_probe]
build_src_filter = +<pin_probe.cpp>

[env:imu_node]
build_src_filter = +<imu_node.cpp>
lib_deps =
	ITTIoT
	adafruit/Adafruit MPU6050 @ ^2.2.9
	ClickEncoder
