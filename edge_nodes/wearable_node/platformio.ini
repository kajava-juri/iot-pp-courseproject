; PlatformIO Project Configuration – Wearable Node
; ─────────────────────────────────────────────────────────────────────────────
; Target: ESP32-based wearable device
; Role:   Reads health / activity sensors and publishes data over MQTT.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient @ ^2.8   ; MQTT client
    adafruit/Adafruit MPU6050       ; IMU (accelerometer / gyroscope)

monitor_speed = 115200
