services:
  frontend:
    build:
      dockerfile: Dockerfile.dev
      args:
        VITE_WEB_PORT: ${VITE_WEB_PORT}
        VITE_SERVER_URL: ${VITE_SERVER_URL}
        VITE_FALL_EVENT_TOPIC: ${VITE_FALL_EVENT_TOPIC}
        VITE_ALERT_TOPIC: ${VITE_ALERT_TOPIC}
        VITE_WEARABLE_IMU_TOPIC_PREFIX: ${VITE_WEARABLE_IMU_TOPIC_PREFIX}
    volumes:
      - ./server/frontend:/app:delegated
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

volumes:
  frontend_node_modules:
    driver: local
