services:
  # ── Svelte UI (Node.js dev server) ──────────────────────────────────────────
  svelte-ui:
    build:
      context: ./server/svelte-ui
      dockerfile: Dockerfile
    container_name: svelte-ui
    ports:
      - "5173:5173"
    volumes:
      - ./server/svelte-ui:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - iot-network
    depends_on:
      - mosquitto

  # ── Mosquitto MQTT Broker ────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./server/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iot-network
    restart: unless-stopped

  # ── Node-RED ─────────────────────────────────────────────────────────────────
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./server/nodered/data:/data
    environment:
      - TZ=Europe/Tallinn
    networks:
      - iot-network
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:

networks:
  iot-network:
    driver: bridge
