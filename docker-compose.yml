services:
  # ── SvelteKit Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./server/frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV}
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
    env_file:
      - .env
    networks:
      - iot-network
    depends_on:
      - backend
      - mosquitto

  postgres:
    image: postgres:18.3-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_volume:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME} -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iot-network

  # ── Go Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      DB_USER: postgres
    networks:
      - iot-network
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # ── Mosquitto MQTT Broker ────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./server/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iot-network
    restart: unless-stopped

  # ── Node-RED ─────────────────────────────────────────────────────────────────
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./server/nodered/data:/data
    environment:
      - TZ=Europe/Tallinn
    networks:
      - iot-network
    depends_on:
      - mosquitto
    restart: unless-stopped

  pgadmin:
    image: elestio/pgadmin:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    env_file:
      - .env
    volumes:
      - pgadmin_volume:/var/lib/pgadmin:rw
    depends_on:
      - postgres
    networks:
      - iot-network

volumes:
  mosquitto-data:
  mosquitto-log:
  pg_volume:
  pgadmin_volume:
    driver: local

networks:
  iot-network:
    driver: bridge
